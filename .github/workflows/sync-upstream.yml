# Keep this fork's main = drewsum/KiPI main + the fork's own work.
# Daily (and on demand): merge upstream main into main, lint and test, and push only if
# everything passes. On a merge conflict or a failure nothing is pushed, and one issue,
# "Upstream sync needs attention", is opened (or updated) with the details.
name: Sync upstream

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/drewsum/KiPI.git
  ISSUE_TITLE: Upstream sync needs attention

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge drewsum/KiPI main $(git rev-parse --short upstream/main)" upstream/main; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.merge.outputs.status != 'conflict'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        if: steps.merge.outputs.status != 'conflict'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        id: ruff
        if: steps.merge.outputs.status != 'conflict'
        continue-on-error: true
        run: ruff check . 2>&1 | tee ruff.log; exit "${PIPESTATUS[0]}"

      - name: Pytest
        id: pytest
        if: steps.merge.outputs.status != 'conflict'
        continue-on-error: true
        run: python -m pytest -q -rfE 2>&1 | tee pytest.log; exit "${PIPESTATUS[0]}"

      - name: Push main
        if: >-
          steps.merge.outputs.status == 'merged' &&
          steps.ruff.outcome == 'success' && steps.pytest.outcome == 'success'
        run: git push origin HEAD:main

      - name: Open or update the issue
        if: >-
          steps.merge.outputs.status == 'conflict' ||
          steps.ruff.outcome == 'failure' || steps.pytest.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
          UP: ${{ steps.merge.outputs.upstream }}
          RUFF: ${{ steps.ruff.outcome }}
          TESTS: ${{ steps.pytest.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Syncing drewsum/KiPI main ($UP) into main needs attention. Nothing was pushed."
            echo
            echo "Run: $RUN_URL"
            echo
            if [ "$STATUS" = conflict ]; then
              echo "### Merge conflict in"
              sed 's/^/- `/; s/$/`/' conflicts.txt
            fi
            if [ "$RUFF" = failure ]; then
              echo "### Ruff"
              echo '```'; tail -n 60 ruff.log; echo '```'
            fi
            if [ "$TESTS" = failure ]; then
              echo "### Failing tests"
              echo '```'
              grep -E '^(FAILED|ERROR) ' pytest.log || tail -n 40 pytest.log
              echo '```'
            fi
          } > body.md
          num=$(gh issue list --state open --limit 100 --json number,title \
                --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
            gh issue comment "$num" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Fail the run when the sync needs attention
        if: >-
          steps.merge.outputs.status == 'conflict' ||
          steps.ruff.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: exit 1
